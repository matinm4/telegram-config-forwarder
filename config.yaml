# نمونه پیکربندی سامانه جمع‌آوری و انتشار کانفیگ
# راهنمای کامل هر گزینه: docs/CONFIGURATION.fa.md
# اسرار (توکن‌ها) هرگز اینجا نوشته نمی‌شوند؛ فقط از متغیر محیطی خوانده می‌شوند.
version: 1
schedule:
  interval_hours: 3
sources:
  - id: "src_toxicvid"
    username: "ToxicVid"
    enabled: true
    fetch_mode: "auto"      # scrape | telethon | auto
    proxy: null             # اختیاری، مثل socks5://127.0.0.1:10808
  - id: "src_configshub"
    username: "ConfigsHUB"
    enabled: true
    fetch_mode: "auto"
    proxy: null
  - id: "src_v2raysvmess"
    username: "v2raysvmess"
    enabled: true
    fetch_mode: "auto"
    proxy: null
  - id: "src_proxymmdfreak"
    username: "ProxyMmDFreak"
    enabled: true
    fetch_mode: "auto"
    proxy: null
  - id: "src_filembad"
    username: "filembad"
    enabled: true
    fetch_mode: "auto"
    proxy: null
destinations:
  - id: "main"
    chat: "@ApexConfigVpn"
    enabled: true
    sender: "auto"          # bot_api | telethon | auto
    quarantine: false
    footer: |-
      🔗 @ApexConfigVpn 🚀 به جمع کاربران کانال ما بپیوندید!
      هر روز جدیدترین کانفیگ‌های رایگان، پرسرعت و تست‌شده منتشر می‌شود.
      💎 بدون هزینه
      ⚡️ سرعت بالا
      🔄 بروزرسانی مداوم
      📌 عضویت در کانال = دسترسی همیشگی به جدیدترین کانفیگ‌ها
  - id: "quantum"
    chat: "@QuantumConfigX"
    enabled: true
    sender: "auto"
    quarantine: false
    footer: |-
      🔗 @QuantumConfigX 🚀 به جمع کاربران کانال ما بپیوندید!
      هر روز جدیدترین کانفیگ‌های رایگان، پرسرعت و تست‌شده منتشر می‌شود.
      💎 بدون هزینه
      ⚡️ سرعت بالا
      🔄 بروزرسانی مداوم
      📌 عضویت در کانال = دسترسی همیشگی به جدیدترین کانفیگ‌ها
  - id: "irannet"
    chat: "@irannetvpn"
    enabled: true
    sender: "auto"
    quarantine: false
    footer: |-
      🔗 @irannetvpn 🌐 به خانواده بزرگ ما بپیوندید!
      هر روز تازه‌ترین کانفیگ‌های رایگان و پرسرعت اینجاست.
      💎 کاملاً رایگان
      ⚡️ اتصال پایدار و سریع
      🔄 آپدیت روزانه
      📌 با عضویت در کانال، همیشه به‌روز بمانید
  - id: "hyper"
    chat: "@HyperConfigPro"
    enabled: true
    sender: "auto"
    quarantine: false
    footer: |-
      🔗 @HyperConfigPro ⚡️ به کانال حرفه‌ای‌ها بپیوندید!
      گلچین بهترین کانفیگ‌های روز، رایگان و تست‌شده.
      💎 بدون هزینه
      🚀 سرعت فوق‌العاده
      🔄 انتشار مداوم
      📌 عضو شوید تا هیچ کانفیگی را از دست ندهید
  - id: "quarantine"
    chat: "@my_quarantine1"
    enabled: true
    sender: "auto"
    quarantine: true        # کانال قرنطینه واقعی
distribution:
  strategy: "round_robin"  # چرخشی: هر کانفیگ فقط به یک کانال می‌رود و بین ۴ کانال می‌چرخد (بدون تکرار)
  batch_send: true         # دسته‌ای: همه کانفیگ‌های هر پست در یک/چند پیام جمع‌بندی‌شده می‌روند
filtering:
  enabled: true
  rules:
    - { type: "exact", pattern: "تبلیغات", scope: "both", enabled: true }
  append_destination_username: true
location:
  enabled: true
  fallback_display: "Unknown"
testing:
  enabled: false        # موقتاً خاموش: ارسال مستقیم بدون تست Xray
  timeout_s: 15
  xray_version: "v26.3.27"
fallback:
  source_fallback_enabled: true
  sender_fallback_enabled: true
  after_failures: 2
retry:
  max_attempts: 3
  backoff_s: [1, 2, 4]
concurrency:
  source_limit: 4
  test_limit: 4
logging:
  level: "INFO"
