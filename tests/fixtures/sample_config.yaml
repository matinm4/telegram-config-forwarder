destinations:
  - {id: "main", chat: "@testdest", enabled: true, sender: "bot_api", quarantine: false}
  - {id: "q", chat: "@testquar", enabled: true, sender: "bot_api", quarantine: true}
distribution: {strategy: "round_robin"}
filtering: {enabled: true, rules: [], append_destination_username: true}
location: {enabled: false, fallback_display: "Unknown"}
testing: {enabled: false, timeout_s: 15, xray_version: "v25.9.1"}
fallback: {source_fallback_enabled: true, sender_fallback_enabled: true, after_failures: 2}
logging: {level: "INFO"}
